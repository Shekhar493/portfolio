# Netlify configuration for static site hosting
# If your site lives in a subfolder, set in Netlify UI: NETLIFY_PUBLISH_DIR=portfolio

[build]
  command = ""
  publish = "$NETLIFY_PUBLISH_DIR"

# Optional: Redirect root if you publish a subdirectory via NETLIFY_PUBLISH_DIR
# [[redirects]]
#   from = "/"
#   to = "/index.html"
#   status = 200

# Basic cache headers for assets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
