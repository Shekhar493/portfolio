<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio World | Chandra Shekhar Yadav</title>
    <meta name="description" content="Interactive 2D Portfolio World — explore buildings representing AI, GIS, accessibility, and gaming projects.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .world-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .world-intro {
            text-align: center;
            margin-bottom: 3rem;
        }

        .world-intro h2 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .world-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .world-building {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            padding: 2.5rem 2rem;
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .world-building::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--building-color, var(--primary-color));
        }

        .world-building:hover, .world-building:focus-visible {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--building-color, var(--primary-color));
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--building-color, rgba(56,189,248,0.4));
            outline: none;
        }

        .building-icon {
            font-size: 3.5rem;
            margin-bottom: 1.25rem;
            transition: transform 0.3s ease;
        }

        .world-building:hover .building-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .building-name {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            color: #fff;
            margin: 0 0 0.5rem 0;
        }

        .building-sub {
            color: #94a3b8;
            font-size: 0.95rem;
            margin: 0;
            line-height: 1.4;
        }

        .building-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            font-family: var(--font-code);
        }

        .world-building.visited .building-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        /* World Modal */
        .world-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .world-modal-card {
            background: #0e1525;
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            max-width: 600px;
            width: 100%;
            padding: 2.5rem;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .world-modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0.25rem;
        }

        .world-modal-close:hover { color: #fff; }

        .hidden-duck {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            font-size: 1.4rem;
            opacity: 0.3;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.3s;
            user-select: none;
            z-index: 100;
        }

        .hidden-duck:hover {
            opacity: 1;
            transform: scale(1.3);
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="cursor-follower"></div>

    <!-- Unified Navbar -->
    <nav class="navbar">
        <div class="logo">CS<span>Y</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="arcade.html">Arcade</a></li>
            <li><a href="world.html" class="active">World</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-actions">
            <button class="nav-icon-btn" id="sound-toggle-btn" title="Toggle Sound" aria-label="Toggle Sound">
                <i class="fas fa-volume-mute" id="sound-icon"></i>
            </button>
            <button class="cmd-k-btn" id="cmd-k-trigger" title="Quick Search (Ctrl+K)">
                <i class="fas fa-search"></i>
                <span class="cmd-k-badge">⌘K</span>
            </button>
            <div class="theme-dropdown">
                <button class="theme-btn" id="theme-toggle" title="Switch Theme">
                    <i class="fas fa-palette"></i>
                </button>
                <div class="theme-menu" id="theme-menu">
                    <button class="theme-option" data-theme="default"><i class="fas fa-fire" style="color:#38bdf8;"></i> Cosmic Cyan</button>
                    <button class="theme-option" data-theme="violet"><i class="fas fa-bolt" style="color:#a855f7;"></i> Neon Violet</button>
                    <button class="theme-option" data-theme="matrix"><i class="fas fa-terminal" style="color:#10b981;"></i> Matrix Green</button>
                    <button class="theme-option" data-theme="cyberpunk"><i class="fas fa-vr-cardboard" style="color:#00f0ff;"></i> Cyberpunk</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="world-container" style="padding-top: 110px;">
        <div class="world-intro">
            <h2>🏙️ Explore the <span style="color:var(--primary-color)">Interactive District</span></h2>
            <p style="color: #94a3b8; max-width: 600px; margin: 0.75rem auto 0;">
                Welcome to Chandra Shekhar Yadav's interactive project world. Each building represents a domain of work, research, or capability. Click any building to explore!
            </p>
        </div>

        <div class="world-grid" id="world-grid">
            <!-- Buildings rendered dynamically via portfolioWorld.js -->
        </div>
    </main>

    <div class="hidden-duck" id="world-hidden-duck" title="Quack! 🦆">🦆</div>

    <!-- Building Modal -->
    <div class="world-modal-backdrop" id="world-modal-backdrop">
        <div class="world-modal-card">
            <button class="world-modal-close" id="world-modal-close" aria-label="Close">✕</button>
            <div id="world-modal-body"></div>
        </div>
    </div>

    <!-- Command Palette -->
    <div class="cmd-palette-backdrop" id="cmd-palette">
        <div class="cmd-palette-container">
            <div class="cmd-search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="cmd-input" class="cmd-input" placeholder="Search pages, themes...">
            </div>
            <div class="cmd-results" id="cmd-results"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="script.js"></script>
    <script type="module" src="src/games/portfolioWorld.js"></script>
</body>
</html>
