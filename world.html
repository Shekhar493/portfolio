<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio World | Chandra Shekhar Yadav</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow-x: hidden;
        }

        .world-header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .world-title-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .world-title-area h1 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            margin: 0;
            color: #fff;
        }

        .world-container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .world-intro {
            text-align: center;
            margin-bottom: 3rem;
        }

        .world-intro h2 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .world-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .world-building {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            padding: 2.5rem 2rem;
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .world-building::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--building-color, var(--primary-color));
        }

        .world-building:hover, .world-building:focus-visible {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--building-color, var(--primary-color));
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--building-color);
        }

        .building-icon {
            font-size: 3.5rem;
            margin-bottom: 1.25rem;
            transition: transform 0.3s ease;
        }

        .world-building:hover .building-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .building-name {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: #fff;
            margin: 0 0 0.5rem 0;
        }

        .building-sub {
            color: #94a3b8;
            font-size: 0.95rem;
            margin: 0;
            line-height: 1.4;
        }

        .building-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            font-family: var(--font-code);
        }

        .world-building.visited .building-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        /* Modal */
        .world-modal-backdrop {
            position: fixed;
            inset: 0;
            background: var(--modal-backdrop);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .world-modal-card {
            background: #121622;
            border: 1px solid var(--glass-border);
            border-radius: 1.25rem;
            max-width: 600px;
            width: 100%;
            padding: 2.5rem;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .world-modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .world-modal-close:hover {
            color: #fff;
        }

        .hidden-duck {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            font-size: 1.2rem;
            opacity: 0.3;
            cursor: pointer;
            transition: opacity 0.3s;
            user-select: none;
        }

        .hidden-duck:hover {
            opacity: 1;
        }
    </style>
</head>
<body data-mode="interactive">
    <canvas id="bg-canvas"></canvas>
    <div class="cursor-follower"></div>

    <!-- Unified Navbar -->
    <nav class="navbar">
        <div class="logo">CS<span>Y</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="arcade.html">Arcade</a></li>
            <li><a href="world.html" class="active">World</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-actions">
            <span style="color: #94a3b8; font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem;">
                <i class="fas fa-city" style="color:var(--primary-color);"></i> 2D District
            </span>
        </div>
    </nav>

    <main class="world-container">
        <div class="world-intro">
            <h2>Explore the Interactive District</h2>
            <p style="color: #94a3b8; max-width: 600px; margin: 0 auto;">
                Welcome to Chandra Shekhar Yadav's interactive project world. Each building represents a domain of work, research, or capability.
            </p>
        </div>

        <div class="world-grid" id="world-grid">
            <!-- Buildings rendered dynamically via JavaScript -->
        </div>
    </main>

    <div class="hidden-duck" id="world-hidden-duck" title="Quack!">🦆</div>

    <!-- Building Modal Backdrop -->
    <div class="world-modal-backdrop" id="world-modal-backdrop">
        <div class="world-modal-card">
            <button class="world-modal-close" id="world-modal-close">✕</button>
            <div id="world-modal-body">
                <!-- Content dynamically injected -->
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="src/games/portfolioWorld.js"></script>
</body>
</html>
